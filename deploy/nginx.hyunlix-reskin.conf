# Hyunlix 换皮独立站点（与 flyingwanpen.top 主站并存，反代到 8091）

# www 非规范域一律 301 到 apex；sitemap/canonical 只含 https://hyunlix.top/。
# 注意：443 的 www 需要证书覆盖 www.hyunlix.top（certbot --expand）后才能握手成功。
server {
    listen 80;
    server_name www.hyunlix.top;
    return 301 https://hyunlix.top$request_uri;
}

server {
    server_name hyunlix.top;
    client_max_body_size 4m;

    limit_conn perip 60;
    limit_conn_status 429;

    location = /assets/bgm.mp3 {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        slice 1m;
        proxy_set_header Range $slice_range;
        proxy_cache static_cache;
        proxy_cache_key $host$uri$slice_range;
        proxy_cache_valid 200 206 7d;
        limit_rate_after 512k;
        limit_rate 64k;
        limit_conn bgm_perip 4;
        limit_req zone=bgm_rps burst=24 nodelay;
        limit_req_status 429;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=86400";
        add_header X-Cache-Status $upstream_cache_status;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache static_cache;
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating;
        # Safari 对上游 PocketBase 的 Vary: Origin 图片缓存会把后续 <img> 判失败（蓝问号破图）
        proxy_ignore_headers Vary Set-Cookie;
        proxy_hide_header Vary;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location /api/realtime {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 80;
}
