# 飞天碗盆生产反代（实机验证过的完整配置，放到 /etc/nginx/conf.d/）。
# 依赖 http 块内已定义：
#   proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:10m
#                    max_size=2g inactive=7d use_temp_path=off;
#   gzip on; gzip_types application/json application/javascript text/css;
#
# HTTPS：证书由 certbot（Let's Encrypt）签发与续期管理——
#   yum install -y certbot python2-certbot-nginx   # CentOS 7（EPEL）
#   certbot --nginx -d flyingwanpen.top -d www.flyingwanpen.top \
#     --non-interactive --agree-tos --redirect -m admin@flyingwanpen.top
#   systemctl enable --now certbot-renew.timer     # 每日自动 certbot renew
# 续期配置 /etc/letsencrypt/renewal/flyingwanpen.top.conf 中 installer=nginx，
# 证书轮换后 certbot 会自动 reload nginx。下方 “managed by Certbot” 的行
# 即 certbot 注入的证书引用（只引用标准路径，密钥本体不入库）。
#
# 重要：反代之后 PocketBase 看到的来源地址都是 127.0.0.1，按 IP 限流会全站
# 共享同一个桶。必须在 PocketBase 设置里信任本配置注入的 X-Real-IP：
#   管理面板 /_/ → Settings → Application → Trusted proxy headers 填 X-Real-IP，
#   或用超管 token 调 PATCH /api/settings：
#   {"trustedProxy":{"headers":["X-Real-IP"],"useLeftmostIP":false}}

server {
    server_name flyingwanpen.top www.flyingwanpen.top;
    client_max_body_size 4m;

    # 静态资源：边缘缓存 1 小时，照抄应用层 Cache-Control 策略
    location /assets/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache static_cache;
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # PocketBase realtime（SSE）：关闭缓冲防挂起（当前前端未使用，预留）
    location /api/realtime {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # 管理面板：上线后建议按来源 IP 收紧，例如：
    # location /_/ { allow 1.2.3.4; deny all; proxy_pass http://127.0.0.1:8090; }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/flyingwanpen.top/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/flyingwanpen.top/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP 入口：域名访问 301 到各自 HTTPS；其余 Host（含裸 IP 直访的老玩家、
# 收藏夹存量流量）统一 301 到正式域名 HTTPS，而不是 404 断线
server {
    if ($host = www.flyingwanpen.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = flyingwanpen.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    server_name flyingwanpen.top www.flyingwanpen.top;
    # 兜底（含裸 IP 访问的老玩家）：统一 301 到正式域名 HTTPS，而不是 404 断线
    return 301 https://flyingwanpen.top$request_uri;
}
