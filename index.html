<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon-duo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#fcf1e4" />
    <meta name="description" content="Hyunjin × Felix (Hyunlix): a cute duo fan flying game with three characters, leaderboards, and danmaku messages." />
    <link rel="stylesheet" href="/style.css">
    <title>Hyunjin × Felix</title>
    <style>
        #boot-fallback {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            display: block;
            text-align: center;
            color: #a2536b;
            font-weight: bold;
            pointer-events: none;
        }
        #boot-fallback .boot-inner { margin-top: 42vh; padding: 0 24px; }
        #boot-loading { font-size: 15px; letter-spacing: .2em; animation: boot-pulse 1.4s ease-in-out infinite; }
        @keyframes boot-pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
        #boot-error { display: none; pointer-events: auto; }
        #boot-error p { margin: 0 0 6px; font-size: 15px; }
        #boot-error small { display: block; margin-bottom: 14px; color: #bb8ba0; font-size: 12px; font-weight: normal; }
        #boot-error button {
            padding: 10px 34px;
            color: #5c2440;
            background: #ffa9c8;
            border: 2px solid #d3688b;
            border-radius: 999px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <div id="boot-fallback">
        <div class="boot-inner">
            <div id="boot-loading">Loading…</div>
            <div id="boot-error" role="alert">
                <p>Load failed or network is slow</p>
                <small>Tap retry. If it keeps failing, try a newer browser.</small>
                <button type="button" onclick="location.reload()">Retry</button>
            </div>
        </div>
    </div>
    <script>
        (function () {
            if (typeof window.globalThis === 'undefined') window.globalThis = window;

            function showBootError() {
                var fallback = document.getElementById('boot-fallback');
                var error = document.getElementById('boot-error');
                var loading = document.getElementById('boot-loading');
                if (!fallback || !error) return;
                if (loading) loading.style.display = 'none';
                error.style.display = 'block';
            }

            var probe = document.createElement('script');
            if (!('noModule' in probe)) {
                window.setTimeout(showBootError, 0);
                return;
            }

            window.addEventListener('error', function (event) {
                if (!document.getElementById('boot-fallback')) return;
                var target = event && event.target;
                var isResource = !!(target && target.tagName
                    && (target.tagName === 'SCRIPT' || target.tagName === 'LINK'));
                if (isResource || (event && event.error)) showBootError();
            }, true);

            window.setTimeout(showBootError, 20000);
        })();
    </script>
    <script type="module" src="/src/main.tsx"></script>

</body>
</html>
