# Uptime Kuma: https://status.hyunlix.top → 127.0.0.1:3001
# NameSilo: A record  status → 45.205.25.73
# Then:
#   cp deploy/nginx.status.hyunlix.conf /etc/nginx/conf.d/status.hyunlix.conf
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d status.hyunlix.top

server {
    listen 80;
    server_name status.hyunlix.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name status.hyunlix.top;

    # After certbot:
    # ssl_certificate /etc/letsencrypt/live/status.hyunlix.top/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/status.hyunlix.top/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
