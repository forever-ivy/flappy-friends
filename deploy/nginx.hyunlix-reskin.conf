# Hyunlix 换皮独立站点（与 flyingwanpen.top 主站并存，反代到 8091）
server {
    server_name hyunlix.top www.hyunlix.top;
    client_max_body_size 4m;

    limit_conn perip 60;
    limit_conn_status 429;

    location = /assets/bgm.mp3 {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        slice 1m;
        proxy_set_header Range $slice_range;
        proxy_cache static_cache;
        proxy_cache_key $host$uri$slice_range;
        proxy_cache_valid 200 206 7d;
        limit_rate_after 512k;
        limit_rate 64k;
        limit_conn bgm_perip 4;
        limit_req zone=bgm_rps burst=24 nodelay;
        limit_req_status 429;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=86400";
        add_header X-Cache-Status $upstream_cache_status;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache static_cache;
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location /api/realtime {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 80;
}
