# Umami: https://stats.hyunlix.top → 127.0.0.1:3000
# NameSilo: A record  stats → 45.205.25.73
# Then:
#   cp deploy/nginx.stats.hyunlix.conf /etc/nginx/conf.d/stats.hyunlix.conf
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d stats.hyunlix.top

server {
    listen 80;
    server_name stats.hyunlix.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name stats.hyunlix.top;

    # After certbot, these lines are usually rewritten; placeholders for first install:
    # ssl_certificate /etc/letsencrypt/live/stats.hyunlix.top/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/stats.hyunlix.top/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
