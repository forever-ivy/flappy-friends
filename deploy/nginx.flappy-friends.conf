# 飞天碗盆生产反代（实机验证过的完整配置，放到 /etc/nginx/conf.d/）。
# 依赖 http 块内已定义：
#   proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:10m
#                    max_size=2g inactive=7d use_temp_path=off;
#   gzip on;
#   gzip_comp_level 5;
#   gzip_min_length 1024;
#   gzip_types application/json application/javascript text/javascript text/css
#              text/plain image/svg+xml application/xml text/xml;
#   gzip_proxied any;
#   gzip_vary on;
#   # 2026-08-26 带宽打满事件新增（按客户端 IP 限并发 + bgm 请求频率）：
#   limit_conn_zone $binary_remote_addr zone=perip:10m;
#   limit_conn_zone $binary_remote_addr zone=bgm_perip:10m;
#   # bgm 每 IP 请求频率：正常一次会话只需几个 Range 请求；重试循环客户端
#   # 每个新请求都能白拿 limit_rate_after 的 512KB 快速头，必须按次数限。
#   # burst=24 覆盖 CGNAT 多玩家同启，超出返回 429（无音乐，游戏不受影响）
#   limit_req_zone $binary_remote_addr zone=bgm_rps:10m rate=10r/m;
# 注意 gzip_types 必须含 text/javascript：PocketBase（Go mime 表）对 .js 返回的
# Content-Type 是 text/javascript，漏掉它会导致 1.35MB 的 phaser bundle 裸传——
# 2026-08-26 流量高峰时曾因此出口带宽打满，页面加载 18s+，玩家以为服务器崩了。
#
# HTTPS：证书由 certbot（Let's Encrypt）签发与续期管理——
#   yum install -y certbot python2-certbot-nginx   # CentOS 7（EPEL）
#   certbot --nginx -d flyingwanpen.top -d www.flyingwanpen.top \
#     --non-interactive --agree-tos --redirect -m admin@flyingwanpen.top
#   systemctl enable --now certbot-renew.timer     # 每日自动 certbot renew
# 续期配置 /etc/letsencrypt/renewal/flyingwanpen.top.conf 中 installer=nginx，
# 证书轮换后 certbot 会自动 reload nginx。下方 “managed by Certbot” 的行
# 即 certbot 注入的证书引用（只引用标准路径，密钥本体不入库）。
#
# 重要：反代之后 PocketBase 看到的来源地址都是 127.0.0.1，按 IP 限流会全站
# 共享同一个桶。必须在 PocketBase 设置里信任本配置注入的 X-Real-IP：
#   管理面板 /_/ → Settings → Application → Trusted proxy headers 填 X-Real-IP，
#   或用超管 token 调 PATCH /api/settings：
#   {"trustedProxy":{"headers":["X-Real-IP"],"useLeftmostIP":false}}

server {
    server_name flyingwanpen.top www.flyingwanpen.top;
    client_max_body_size 4m;

    # 2026-08-26 出口带宽打满事件缓解：全站每 IP 并发上限（HTTP/2 下按并发
    # 请求计数；Phaser 预载并行度 + 移动网 CGNAT 共享 IP，故放宽到 60）
    limit_conn perip 60;
    limit_conn_status 429;

    # bgm.mp3（3.1MB / 112kbps / 3min42s，已压缩音频，gzip 无效；2026-08-26
    # 事发时旧 5.3MB 版占出口流量 60%+）。播放实时只需 14KB/s：首 512KB 全速
    # 起播（约 37s 音频缓冲），之后限 64KB/s（约 4.6 倍码率，播放不卡但不再
    # 瞬间抢满管道；提前退出的玩家不再下完整个文件）。每 IP 最多 4 路 bgm 流。
    # slice 分片缓存：1MB 一片存本地，之后所有请求（含浏览器媒体 Range 请求）
    # 命中缓存不回源。proxy_buffering 必须保持默认开启，
    # 否则 limit_rate 完全不生效（无缓冲反代下 nginx 不做出向限速）。
    # 浏览器缓存 1d：bgm 无指纹文件名，勿设过长以免换曲后客户端长期陈旧。
    location = /assets/bgm.mp3 {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        slice 1m;
        proxy_set_header Range $slice_range;
        proxy_cache static_cache;
        proxy_cache_key $uri$slice_range;
        proxy_cache_valid 200 206 7d;
        limit_rate_after 512k;
        limit_rate 64k;
        limit_conn bgm_perip 4;
        limit_req zone=bgm_rps burst=24 nodelay;
        limit_req_status 429;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=86400";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # 静态资源：边缘缓存 1 小时，照抄应用层 Cache-Control 策略
    location /assets/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache static_cache;
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # PocketBase realtime（SSE）：关闭缓冲防挂起（当前前端未使用，预留）
    location /api/realtime {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # 管理面板：上线后建议按来源 IP 收紧，例如：
    # location /_/ { allow 1.2.3.4; deny all; proxy_pass http://127.0.0.1:8090; }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/flyingwanpen.top/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/flyingwanpen.top/privkey.pem; # managed by Certbot
    # 高峰在线时 certbot 默认的 1m/10m 会话缓存会满（error log 刷
    # "could not allocate new session in SSL session shared cache"），
    # 已把 /etc/letsencrypt/options-ssl-nginx.conf 的
    # ssl_session_cache 调到 shared:le_nginx_SSL:50m
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP 入口：域名访问 301 到各自 HTTPS；其余 Host（含裸 IP 直访的老玩家、
# 收藏夹存量流量）统一 301 到正式域名 HTTPS，而不是 404 断线
server {
    if ($host = www.flyingwanpen.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = flyingwanpen.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    server_name flyingwanpen.top www.flyingwanpen.top;
    # 兜底（含裸 IP 访问的老玩家）：统一 301 到正式域名 HTTPS，而不是 404 断线
    return 301 https://flyingwanpen.top$request_uri;
}
