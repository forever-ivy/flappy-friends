# Umami analytics for hyunlix.top
# Usage on VPS:
#   mkdir -p /opt/umami && cp this file there
#   # edit APP_SECRET + DB password below
#   docker compose up -d
# Dashboard: https://stats.hyunlix.top  (nginx reverse proxy → 127.0.0.1:3000)
# Default login: admin / umami  → change immediately

services:
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-change-me}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-replace-with-long-random-string-at-least-32-chars}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/heartbeat || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-change-me}
    volumes:
      - umami-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  umami-db:
